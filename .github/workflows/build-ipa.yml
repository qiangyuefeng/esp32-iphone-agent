name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      # 仓库里已有 IPhoneAgent.xcodeproj，直接构建，不需要 XcodeGen。
      # 不创建 Local.xcconfig：使用 Shared.xcconfig 默认值（无付费权限、示例 bundle id）。
      # 签名在本地用 Sideloadly 完成，所以这里关闭代码签名。
      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme IPhoneAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/IPhoneAgent.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: app not found at $APP"; ls -R build/Build/Products || true; exit 1
          fi
          rm -rf Payload IPhoneAgent.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -y IPhoneAgent.ipa Payload >/dev/null
          echo "----- built ipa -----"; ls -la IPhoneAgent.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-ipa
          path: ios/IPhoneAgent.ipa
          if-no-files-found: error
